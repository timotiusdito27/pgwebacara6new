<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Kabupaten Flores Timur</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .navbar {
            z-index: 1050;
        }

        /* Legenda */
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            min-width: 180px;
        }

        .legend h6 {
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        .legend-section {
            margin-bottom: 8px;
        }

        .legend-section:last-child {
            margin-bottom: 0;
        }

        .legend-title {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            color: #555;
            display: block;
            margin-bottom: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-color-box {
            width: 20px;
            height: 14px;
            border: 1px solid black;
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-map-location-dot text-warning"></i>
                <span class="fw-semibold">WebGIS Flores Timur</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Nav Item: Link (Dropdown) -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-link me-1"></i> Link
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="navbarDropdown">
                            <li>
                                <h6 class="dropdown-header">Sumber Data</h6>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2"
                                    href="https://florestimurkab.bps.go.id/" target="_blank">
                                    <i class="fa-solid fa-chart-pie text-primary"></i> BPS Kab. Flores Timur
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2"
                                    href="https://tanahair.indonesia.go.id/" target="_blank">
                                    <i class="fa-solid fa-earth-asia text-success"></i> Geoportal KSP (BIG)
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <h6 class="dropdown-header">Rujukan & Repositori</h6>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2" href="https://leafletjs.com/"
                                    target="_blank">
                                    <i class="fa-solid fa-book-atlas text-warning"></i> Leaflet JS
                                </a>
                            </li>
                        </ul>
                    </li>
                    <!-- Nav Item: About -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal">
                            <i class="fa-solid fa-circle-info me-1"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title d-flex align-items-center gap-2" id="aboutModalLabel">
                        <i class="fa-solid fa-circle-info text-info"></i> About
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="card bg-light border-0">
                        <div class="card-body p-3">
                            <table class="table table-borderless mb-0">
                                <tbody>
                                    <tr>
                                        <th scope="row" class="text-secondary ps-0" style="width: 25%;">
                                            <i class="fa-regular fa-user me-2 text-primary"></i>Nama
                                        </th>
                                        <td class="fw-semibold">: Timotius Dito Pramudya</td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="text-secondary ps-0">
                                            <i class="fa-regular fa-id-card me-2 text-success"></i>NIM
                                        </th>
                                        <td class="fw-semibold">: 25/567697/SV/27236</td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="text-secondary ps-0">
                                            <i class="fa-solid fa-chalkboard-user me-2 text-warning"></i>Kelas
                                        </th>
                                        <td class="fw-semibold">: PGWEB A</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.231635977695753, 122.86588340006523], 11);

        // Tile layer basemap
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        // GeoJSON polygon jumlah penduduk
        var jumlahPenduduk = L.geoJSON(null, {

            // Style
            style: function (feature) {
                var val = feature.properties.Penduduk || feature.properties.jumlah_penduduk || 0;

                if (val <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#000080'
                    };
                }
                if (val > 12000 && val <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#0000FF'
                    };
                }
                if (val > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#00FFFF'
                    };
                }
            },

            // Each feature
            onEachFeature: function (feature, layer) {
                var kecamatan = feature.properties.WADMKC || feature.properties.kecamatan || "Tidak Diketahui";
                var penduduk = feature.properties.Penduduk || feature.properties.jumlah_penduduk || 0;

                // Popup
                var popup_content = "<b>Kecamatan:</b> " + kecamatan + "<br>" +
                    "<b>Jumlah Penduduk:</b> " + penduduk.toLocaleString("id-ID") + " Jiwa";
                layer.bindPopup(popup_content);

                // Tooltip
                layer.bindTooltip("Kec. " + kecamatan, { direction: "center", sticky: true });
            }
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {

            // Style
            style: function (feature) {
                var namaUnsur = feature.properties.NAMA_UNSUR || feature.properties.NAMOBJ || "";

                if (namaUnsur === "Jalan Propinsi" || namaUnsur === "Jalan Provinsi") {
                    return {
                        color: "red",
                        weight: 4,
                        opacity: 1
                    };
                }
                if (namaUnsur === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        weight: 2.5,
                        dashArray: "6, 6",
                        opacity: 1
                    };
                }
                // Jalan Lain / Lainnya
                return {
                    color: "red",
                    weight: 1.2,
                    opacity: 0.9
                };
            },

            // Each feature
            onEachFeature: function (feature, layer) {
                var namaJalan = feature.properties.NAMA_UNSUR || feature.properties.NAMOBJ || "Jalan Tanpa Nama";
                var panjang = feature.properties.Panjang_KM ? feature.properties.Panjang_KM + " km" : "-";

                // Popup
                var popup_content = "<b>Nama Jalan:</b> " + namaJalan + "<br>" +
                    "<b>Panjang:</b> " + panjang;
                layer.bindPopup(popup_content);

                // Tooltip
                layer.bindTooltip(namaJalan, { direction: "auto", sticky: true });
            }
        });

        // GeoJSON point toponimi
        var Toponimi = L.geoJSON(null, {

            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "images/home_marker.png",
                        iconSize: [32, 32],
                        iconAnchor: [16, 32],
                        popupAnchor: [0, -32],
                        tooltipAnchor: [10, -20],
                    }),
                });
            },

            // Each feature
            onEachFeature: function (feature, layer) {
                var nama = feature.properties.TOPONIMI || feature.properties.NAMOBJ || "Tanpa Nama";
                var img = feature.properties.image ? "<br><img src='images/" + feature.properties.image + "' width='200'>" : "";

                // Popup
                var popup_content = "<b>Nama:</b> " + nama + "<br>" +
                    "<b>Koordinat:</b> " + feature.geometry.coordinates[1].toFixed(5) + ", " + feature.geometry.coordinates[0].toFixed(5) + img;
                layer.bindPopup(popup_content);

                // Tooltip
                layer.bindTooltip(nama, { direction: "top", sticky: true });
            }
        });

        // Mengurutkan layer
        $.getJSON("GeoJSON/Jumlah_Penduduk.geojson", function (data) {
            jumlahPenduduk.addData(data);
            jumlahPenduduk.addTo(map);

            $.getJSON("GeoJSON/Jalan.geojson", function (data) {
                jalan.addData(data);
                jalan.addTo(map);

                $.getJSON("GeoJSON/Toponimi.geojson", function (data) {
                    Toponimi.addData(data);
                    Toponimi.addTo(map);
                });
            });
        });

        // Kontrol layer
        var overlayMaps = {
            "Toponimi": Toponimi,
            "Jaringan Jalan": jalan,
            "Jumlah Penduduk": jumlahPenduduk
        };

        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

        // Legenda Peta
        var legend = L.control({ position: "bottomright" });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create("div", "legend");
            div.innerHTML = `
                <h6><strong>LEGENDA PETA</strong></h6>
                
                <!-- Titik Toponimi -->
                <div class="legend-section">
                    <span class="legend-title">Toponimi</span>
                    <div class="legend-item">
                        <img src="images/home_marker.png" width="18" height="18" alt="Toponimi">
                        <span>Titik Toponimi</span>
                    </div>
                </div>

                <!-- Jaringan Jalan -->
                <div class="legend-section">
                    <span class="legend-title">Jaringan Jalan</span>
                    <div class="legend-item">
                        <svg width="28" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="red" stroke-width="4" /></svg>
                        <span>Jalan Provinsi</span>
                    </div>
                    <div class="legend-item">
                        <svg width="28" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="red" stroke-width="2.5" stroke-dasharray="6,4" /></svg>
                        <span>Jalan Kabupaten</span>
                    </div>
                    <div class="legend-item">
                        <svg width="28" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="red" stroke-width="1.2" /></svg>
                        <span>Jalan Lain</span>
                    </div>
                </div>

                <!-- Jumlah Penduduk -->
                <div class="legend-section">
                    <span class="legend-title">Jumlah Penduduk (Jiwa)</span>
                    <div class="legend-item">
                        <span class="legend-color-box" style="background-color: #000080;"></span>
                        <span>&le; 12.000</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color-box" style="background-color: #0000FF;"></span>
                        <span>12.001 - 24.000</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color-box" style="background-color: #00FFFF;"></span>
                        <span>&gt; 24.000</span>
                    </div>
                </div>
            `;

            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            return div;
        };

        legend.addTo(map);

        // 3. TAMBAHKAN KONTROL PENCARIAN DI SINI (DI BAGIAN BAWAH SCRIPT)
        var searchControl = new L.Control.Search({
            layer: jumlahPenduduk,      // Layer yang dijadikan target pencarian (bisa diganti Toponimi)
            propertyName: 'WADMKC',      // Kolom properti di GeoJSON yang dicari (misal: nama kecamatan)
            marker: false,
            moveToLocation: function(latlng, title, map) {
                map.setView(latlng, 13); // Zoom ke lokasi yang dicari
            }
        });

        searchControl.on('search:locationfound', function(e) {
            e.layer.setStyle({
                weight: 3,
                color: 'yellow',
            });
            if (e.layer.openPopup) {
                e.layer.openPopup();
            }
        }).on('search:cancel', function(e) {
            jumlahPenduduk.eachLayer(function(layer) {
                jumlahPenduduk.resetStyle(layer);
            });
        });

        map.addControl(searchControl);

    </script>
    
</body>

</html>
